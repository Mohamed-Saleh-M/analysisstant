<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    
	<link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/style.css')}}">
	
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <title>REGISTER - ANALYSISSTANT</title>
  </head>
  <body class="bg-nav">
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm">
	<h5 class="my-0 mr-md-auto" style="font-family:Trebuchet MS" style="font-size:40px" ><b>ANALYSISSTANT</b></h5>
	<nav class="my-2 my-md-0 mr-md-3">
		<a class="p-2 text-dark" href="home">Home</a>
		<a class="p-2 text-dark" href="about">About</a>
		<a class="p-2 text-dark" href="login">Login</a>
		<a class="p-2"  style="color:blue" href="register"><b>Register</b></a>
	</nav>
	</div>
	
	<div class="container">
	  <div class="row">
	    <div class="col-md-8">
		  <h1 class="text-light display-4 mt-80" style="font-size:80px">Welcome to the World of Stock Analysis.</h1>
		  <h2 class="display-4"  style="font-size:45px color:black "><b><i>Invest Better, Earn Better</i></b></h2>
		</div>
		<div class="col-md-4">
		  <div class="card mt-65">
		    <div class="card-body">
			  <form class="form" method="post" action="/register_validation">
			    <label>NAME</label><br>
				<input type="text" placeholder="Enter your Name" class="form-control" name="name"><br>
			    <label>EMAIL ID</label><br>
				<input type="email" placeholder="Enter your Email ID" class="form-control" name="emailid"><br>
			    <label>PASSWORD</label><br>
				<input type="password" placeholder="Enter your Password" class="form-control" name="password"><br><br>
				 {% if error %}  
					<p><strong>Error</strong>: {{error}}</p> 							
				 {% endif %}  
				<input type="submit" class="btn btn-primary btn-block btn-lg" value="Sign Up">		    
			  </form>
			  <p class="mt-2"> Already a member? <a href="/login">Login</a></p>
			  </div>
			</div>		    
		  </div>
		  
		
		</div>
	  </div>
	</div>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
  </body>
</html>
